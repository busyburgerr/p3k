name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    name: CLI · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Три ОС нужны не для галочки: определение владельца порта в doctor
        # разное на Windows (netstat) и на Unix (lsof, с откатом на ss).
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Дым: команды должны хотя бы запускаться на каждой платформе.
      - run: node dist/cli.js --help
      - run: node dist/cli.js init smoke --template static --no-git
      - run: node dist/cli.js add --list
      - run: node dist/cli.js ship --help
      - run: node dist/cli.js check smoke --list
      # doctor выходит с кодом 1, когда находит блокирующие проблемы, а в
      # свежем каркасе их две: нет node_modules и не скопирован .env. Это его
      # правильная работа, а не поломка, поэтому здесь падением считается
      # только код 2 — отказ разобрать аргументы или необработанная ошибка.
      - name: doctor smoke
        shell: bash
        run: |
          node dist/cli.js doctor smoke && code=0 || code=$?
          test "$code" -le 1 || exit "$code"
      # Правку конфига прогоняем вхолостую: --dry-run печатает тот же отчёт,
      # но ничего не пишет, поэтому шаг ничего за собой не оставляет.
      # --force, чтобы шаг не зависел от того, что слушает раннер.
      - run: node ../dist/cli.js add postgres --dry-run --force
        working-directory: cli/smoke

  site:
    name: Сайт
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: npx vite build
